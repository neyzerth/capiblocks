<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 90" width="120" height="90" role="img" aria-label="Tira de LED encendida en bucle">
  <rect width="120" height="90" fill="#26313c"/>
  <!-- Tira de LED -->
  <rect x="8" y="26" width="104" height="20" rx="6" fill="#1d242b" stroke="#3a4552" stroke-width="1.6"/>
  <g>
    <circle cx="20" cy="36" r="6" fill="#ff695a"/>
    <circle cx="33" cy="36" r="6" fill="#25cc76"/>
    <circle cx="46" cy="36" r="6" fill="#ff695a"/>
    <circle cx="59" cy="36" r="6" fill="#25cc76"/>
    <circle cx="72" cy="36" r="6" fill="#ff695a"/>
    <circle cx="85" cy="36" r="6" fill="#25cc76"/>
    <circle cx="98" cy="36" r="6" fill="#ff695a"/>
  </g>
  <!-- Brillo de los LED -->
  <g fill="#e8f0f7" opacity="0.16">
    <circle cx="20" cy="36" r="11"/>
    <circle cx="46" cy="36" r="11"/>
    <circle cx="72" cy="36" r="11"/>
    <circle cx="98" cy="36" r="11"/>
  </g>
  <!-- Flechas del bucle repetir -->
  <g fill="none" stroke="#1eaaff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">
    <path d="M30 72 h44"/>
    <path d="M68 67 l6 5 l-6 5"/>
    <path d="M92 72 h-10"/>
  </g>
  <!-- Contador de repeticiones -->
  <g>
    <circle cx="96" cy="72" r="9" fill="#ffcf40"/>
    <text x="96" y="76" text-anchor="middle" font-family="ui-sans-serif, Arial, sans-serif" font-size="11" font-weight="700" fill="#1d242b">3</text>
  </g>
  <!-- Pausas entre colores -->
  <g fill="#e8f0f7" opacity="0.45">
    <circle cx="24" cy="72" r="2.4"/>
    <circle cx="32" cy="72" r="2.4"/>
  </g>
</svg>
