<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 90" width="120" height="90" role="img" aria-label="ESP32">
  <rect width="120" height="90" fill="#26313c"/>
  <!-- Placa (vista superior) -->
  <rect x="32" y="12" width="56" height="72" rx="5" fill="#1d242b" stroke="#3a4552" stroke-width="1.6"/>
  <!-- Zona de antena impresa sobre la placa -->
  <rect x="44" y="12" width="32" height="7" fill="#26313c"/>
  <path d="M48 17 v-4 h4 v4 h4 v-4 h4 v4 h4 v-4 h4 v4" fill="none" stroke="#ffcf40" stroke-width="1.4" stroke-linejoin="round"/>
  <!-- Blindo metálico del módulo RF -->
  <rect x="44" y="19" width="32" height="16" rx="1.5" fill="#c9d4de" stroke="#6d7c8d" stroke-width="1.2"/>
  <rect x="50" y="23" width="20" height="8" rx="1" fill="#a9b7c4"/>
  <!-- Regletas de pines sobre la placa -->
  <rect x="35" y="38" width="7" height="40" rx="2" fill="#111922"/>
  <rect x="78" y="38" width="7" height="40" rx="2" fill="#111922"/>
  <g fill="#ffcf40">
    <circle cx="38.5" cy="42" r="1.8"/>
    <circle cx="38.5" cy="50" r="1.8"/>
    <circle cx="38.5" cy="58" r="1.8"/>
    <circle cx="38.5" cy="66" r="1.8"/>
    <circle cx="38.5" cy="74" r="1.8"/>
    <circle cx="81.5" cy="42" r="1.8"/>
    <circle cx="81.5" cy="50" r="1.8"/>
    <circle cx="81.5" cy="58" r="1.8"/>
    <circle cx="81.5" cy="66" r="1.8"/>
    <circle cx="81.5" cy="74" r="1.8"/>
  </g>
  <!-- Microcontrolador con patas -->
  <rect x="51" y="40" width="18" height="12" rx="1.5" fill="#111922"/>
  <g fill="#3a4552">
    <rect x="54" y="38" width="2" height="2"/>
    <rect x="59" y="38" width="2" height="2"/>
    <rect x="64" y="38" width="2" height="2"/>
    <rect x="54" y="52" width="2" height="2"/>
    <rect x="59" y="52" width="2" height="2"/>
    <rect x="64" y="52" width="2" height="2"/>
  </g>
  <!-- Pulsadores EN / BOOT -->
  <rect x="50" y="60" width="8" height="6" rx="1.5" fill="#3a4552"/>
  <rect x="62" y="60" width="8" height="6" rx="1.5" fill="#3a4552"/>
  <!-- LEDs de estado -->
  <circle cx="51" cy="72" r="2.2" fill="#ff695a"/>
  <circle cx="60" cy="72" r="2.2" fill="#25cc76"/>
  <!-- Conector USB -->
  <rect x="54" y="81" width="12" height="7" rx="1.5" fill="#c9d4de" stroke="#6d7c8d" stroke-width="1.2"/>
  <rect x="56.5" y="83.5" width="7" height="2" rx="1" fill="#111922"/>
</svg>
