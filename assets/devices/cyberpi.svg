<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 90" width="120" height="90" role="img" aria-label="CyberPi">
  <rect width="120" height="90" fill="#26313c"/>
  <!-- Carcasa -->
  <rect x="36" y="6" width="48" height="80" rx="7" fill="#1d242b" stroke="#3a4552" stroke-width="1.6"/>
  <!-- Puertos laterales -->
  <rect x="32" y="30" width="5" height="12" rx="1.5" fill="#3a4552"/>
  <rect x="83" y="30" width="5" height="12" rx="1.5" fill="#3a4552"/>
  <!-- Conector superior -->
  <rect x="50" y="4" width="20" height="4" rx="1.5" fill="#c9d4de" stroke="#6d7c8d" stroke-width="1"/>
  <!-- Pantalla -->
  <rect x="43" y="13" width="34" height="28" rx="2.5" fill="#111922" stroke="#3a4552" stroke-width="1.2"/>
  <rect x="45.5" y="15.5" width="29" height="23" rx="1.5" fill="#1eaaff" opacity="0.22"/>
  <rect x="48" y="19" width="16" height="3" rx="1.5" fill="#e8f0f7"/>
  <rect x="48" y="25" width="23" height="3" rx="1.5" fill="#25cc76"/>
  <rect x="48" y="31" width="11" height="3" rx="1.5" fill="#ffcf40"/>
  <!-- Joystick -->
  <circle cx="52" cy="51" r="7" fill="#3a4552" stroke="#111922" stroke-width="1.2"/>
  <circle cx="52" cy="51" r="3.2" fill="#1eaaff"/>
  <!-- Botones A / B -->
  <circle cx="68" cy="47" r="4" fill="#ff695a"/>
  <circle cx="68" cy="57" r="4" fill="#25cc76"/>
  <!-- Tira de LEDs -->
  <g>
    <circle cx="45" cy="72" r="2.4" fill="#ff695a"/>
    <circle cx="53" cy="72" r="2.4" fill="#ffcf40"/>
    <circle cx="61" cy="72" r="2.4" fill="#25cc76"/>
    <circle cx="69" cy="72" r="2.4" fill="#1eaaff"/>
    <circle cx="77" cy="72" r="2.4" fill="#e8f0f7"/>
  </g>
  <rect x="43" y="78" width="34" height="3" rx="1.5" fill="#3a4552"/>
</svg>
